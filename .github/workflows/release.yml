name: Release

# Builds, tests and publishes the image. Each architecture is built and
# tested on its own job, and exactly that image is pushed by digest. Only when
# both passed, the publish job joins them into one multi-arch image with tags
# and creates the GitHub release.

on:
  workflow_dispatch:
    inputs:
      allow_downgrade:
        description: Publish an OpenLDAP version lower than the latest release
        type: boolean
        default: false
  # Called by rebuild.yml when an input of the image changed: the OpenLDAP
  # version, the base image, its packages or a file.
  workflow_call:
    inputs:
      reason:
        description: Why the image is rebuilt, goes into the release notes
        type: string
        default: ''
      no_cache:
        description: Build without the layer cache, to refresh the apt packages
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Resolves the base image once, so both architectures record the same digest.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      base_image: ${{ steps.base.outputs.image }}
      base_digest: ${{ steps.base.outputs.digest }}
      build_date: ${{ steps.date.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # main can pin a lower OpenLDAP than the latest release when Symas
      # withdraws packages. Such a release would move latest backwards.
      - name: Refuse a version downgrade
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
        run: |
          pinned=$(awk -F= '/^ARG OPENLDAP_VERSION=/ { print $2; exit }' Dockerfile)
          # Versions the packager withdrew do not count, see .github/withdrawn-versions.
          withdrawn=$(awk '!/^#/ && NF { print $1 }' .github/withdrawn-versions)
          highest=$(gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}/versions" \
            --paginate --jq '.[].metadata.container.tags[]' |
            sed -n 's/^\([0-9]*\.[0-9]*\.[0-9]*\)-[0-9]*$/\1/p' |
            { grep -vxF "${withdrawn:-none}" || true; } | sort -V | tail -n 1)
          echo "Pinned ${pinned}, highest published ${highest:-none} (withdrawn: ${withdrawn:-none})"
          if [ -n "$highest" ] && [ "$pinned" != "$highest" ] &&
            [ "$(printf '%s\n%s\n' "$pinned" "$highest" | sort -V | head -n 1)" = "$pinned" ] &&
            [ "$ALLOW_DOWNGRADE" != "true" ]; then
            echo "::error::main pins OpenLDAP ${pinned}, lower than the published ${highest}. Run with allow_downgrade to publish it anyway."
            exit 1
          fi

      - name: Build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Resolve the base image digest
        id: base
        run: |
          # FROM pins the base by digest; the label keeps name and tag.
          base=$(awk '$1 == "FROM" { print $2; exit }' Dockerfile)
          digest=$(docker buildx imagetools inspect "$base" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "image=docker.io/library/${base%@*}"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          echo "Base image: $base@$digest"

  build:
    name: build (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # no_cache applies here only. The push below takes these layers from the
      # local builder cache, so it pushes exactly the tested image.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: openldap:test
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base_image }}
            BASE_DIGEST=${{ needs.prepare.outputs.base_digest }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          no-cache: ${{ inputs.no_cache == true }}
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Run the integration tests
        run: ./tests/integration/test-integration.sh openldap:test

      - name: Run the 2.4 to 2.6 migration test
        if: matrix.arch == 'amd64'
        run: ./tests/integration/test-migration.sh openldap:test

      - name: Push the tested image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base_image }}
            BASE_DIGEST=${{ needs.prepare.outputs.base_digest }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      # The SBOM lists the packages of the tested image. It is attached to the
      # pushed digest as a signed attestation.
      - name: Generate the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: openldap:test
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Save the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p build
          echo "$DIGEST" > build/digest
          cp sbom.spdx.json build/sbom.spdx.json

      # The OpenLDAP version comes from the image itself.
      - name: Record the version
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(docker run --rm --platform "linux/$ARCH" --entrypoint "" openldap:test \
            sh -c 'slapd -VV 2>&1' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "OpenLDAP $version"
          echo "$version" > build/version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.arch }}
          path: build/
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: builds

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine the tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat builds/build-amd64/version)
          if [ "$VERSION" != "$(cat builds/build-arm64/version)" ]; then
            echo "::error::amd64 and arm64 report different versions"
            exit 1
          fi
          # Each call on its own line, so a failed request fails the step: a
          # registry error must never look like a free build number.
          EXISTING_TAGS=$(gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}/versions" \
            --paginate --jq '.[].metadata.container.tags[]')
          # Git tags stay when a package or a release is deleted, so they count
          # as taken too. A tag never names two images.
          EXISTING_TAGS="${EXISTING_TAGS}
          $(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${VERSION}-" \
            --jq '.[].ref | sub("^refs/tags/v"; "")')"
          SUFFIX=1
          while echo "$EXISTING_TAGS" | grep -qx "${VERSION}-${SUFFIX}"; do
            SUFFIX=$((SUFFIX + 1))
          done
          {
            echo "version=$VERSION"
            echo "image_tag=${VERSION}-${SUFFIX}"
          } >> "$GITHUB_OUTPUT"
          echo "Selected version: ${VERSION}-${SUFFIX}"

      - name: Create the multi-arch image
        id: index
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ steps.version.outputs.image_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}@$(cat builds/build-amd64/digest)" \
            "${IMAGE}@$(cat builds/build-arm64/digest)"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Signs which workflow built the image, from which commit. Users check
      # it with: gh attestation verify oci://<image> --owner intechcore
      - name: Attest the build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      # gh creates the tag through the API, so the checkout keeps no
      # credentials. The notes summarize the release from the rebuild reason
      # and CHANGELOG.md, list the components and fold the commits since the
      # previous release below, see .github/scripts/release-notes.sh.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.image_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REASON: ${{ inputs.reason }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          BASE_IMAGE: ${{ needs.prepare.outputs.base_image }}
          BASE_DIGEST: ${{ needs.prepare.outputs.base_digest }}
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | head -1)
          symas=$(awk -F= '$1 == "ARG SYMAS_VERSION" { print $2; exit }' Dockerfile)
          PREV_TAG="$PREV_TAG" PRODUCT=OpenLDAP .github/scripts/release-notes.sh \
            "OpenLDAP=${VERSION}" \
            "Symas packages=${symas}" \
            "Base image=${BASE_IMAGE#docker.io/library/}" \
            "Base image digest=${BASE_DIGEST}" > release_notes.md
          cat release_notes.md
          # The signed provenance and the SBOMs travel with the release.
          mkdir -p assets
          cp "$PROVENANCE" "assets/openldap-${TAG}.intoto.jsonl"
          cp builds/build-amd64/sbom.spdx.json "assets/openldap-${TAG}-amd64.spdx.json"
          cp builds/build-arm64/sbom.spdx.json "assets/openldap-${TAG}-arm64.spdx.json"
          # Never attach a release to an existing tag: gh would reuse its commit.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists"
            exit 1
          fi
          gh release create "$TAG" assets/* --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file release_notes.md
