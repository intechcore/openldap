name: Release

# Builds, tests and publishes the image. Each architecture is built and
# tested on its own job, and exactly that image is pushed by digest. Only when
# both passed, the publish job joins them into one multi-arch image with tags
# and creates the GitHub release.

on:
  workflow_dispatch:
  # Called by rebuild.yml when the base image or its packages changed.
  workflow_call:
    inputs:
      reason:
        description: Why the image is rebuilt, goes into the release notes
        type: string
        default: ''
      no_cache:
        description: Build without the layer cache, to refresh the apt packages
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Resolves the base image once, so both architectures record the same digest.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_image: ${{ steps.base.outputs.image }}
      base_digest: ${{ steps.base.outputs.digest }}
      build_date: ${{ steps.date.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Resolve the base image digest
        id: base
        run: |
          base=$(awk '$1 == "FROM" { print $2; exit }' Dockerfile)
          digest=$(docker buildx imagetools inspect "$base" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "image=docker.io/library/$base"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          echo "Base image: $base@$digest"

  build:
    name: build (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # no_cache applies here only. The push below takes these layers from the
      # local builder cache, so it pushes exactly the tested image.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: openldap:test
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base_image }}
            BASE_DIGEST=${{ needs.prepare.outputs.base_digest }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          no-cache: ${{ inputs.no_cache == true }}
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Run the integration tests
        run: ./tests/integration/test-integration.sh openldap:test

      - name: Run the 2.4 to 2.6 migration test
        if: matrix.arch == 'amd64'
        run: ./tests/integration/test-migration.sh openldap:test

      - name: Push the tested image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base_image }}
            BASE_DIGEST=${{ needs.prepare.outputs.base_digest }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      # The SBOM lists the packages of the tested image. It is attached to the
      # pushed digest as a signed attestation.
      - name: Generate the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: openldap:test
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Save the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p build
          echo "$DIGEST" > build/digest

      # The OpenLDAP version comes from the image itself.
      - name: Record the version
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(docker run --rm --platform "linux/$ARCH" --entrypoint "" openldap:test \
            sh -c 'slapd -VV 2>&1' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "OpenLDAP $version"
          echo "$version" > build/version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.arch }}
          path: build/
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: builds

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine the tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat builds/build-amd64/version)
          if [ "$VERSION" != "$(cat builds/build-arm64/version)" ]; then
            echo "::error::amd64 and arm64 report different versions"
            exit 1
          fi
          EXISTING_TAGS=$(gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}/versions" \
            --paginate --jq '.[].metadata.container.tags[]' 2>/dev/null || echo "")
          SUFFIX=1
          while echo "$EXISTING_TAGS" | grep -qx "${VERSION}-${SUFFIX}"; do
            SUFFIX=$((SUFFIX + 1))
          done
          {
            echo "version=$VERSION"
            echo "image_tag=${VERSION}-${SUFFIX}"
          } >> "$GITHUB_OUTPUT"
          echo "Selected version: ${VERSION}-${SUFFIX}"

      - name: Create the multi-arch image
        id: index
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ steps.version.outputs.image_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # shellcheck disable=SC2046 # the conditional tag is empty or two words
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}@$(cat builds/build-amd64/digest)" \
            "${IMAGE}@$(cat builds/build-arm64/digest)"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Signs which workflow built the image, from which commit. Users check
      # it with: gh attestation verify oci://<image> --owner intechcore
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      # gh creates the tag through the API, so the checkout keeps no
      # credentials. The notes list the commits since the previous release.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.image_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REASON: ${{ inputs.reason }}
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | head -1)
          if [ -n "$PREV_TAG" ]; then
            {
              echo "## Changes since ${PREV_TAG}"
              echo ""
              git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD"
            } > release_notes.md
          else
            echo "## Initial Release" > release_notes.md
          fi
          if [ -n "$REASON" ]; then
            printf '\n\n## Rebuild\n\n%s\n' "$REASON" >> release_notes.md
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file release_notes.md
