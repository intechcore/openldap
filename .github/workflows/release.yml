name: Release

on:
  workflow_dispatch:
  # Called by rebuild.yml when the base image or its packages changed.
  workflow_call:
    inputs:
      reason:
        description: Why the image is rebuilt, goes into the release notes
        type: string
        default: ''
      no_cache:
        description: Build without the layer cache, to refresh the apt packages
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve base image digest
        id: base
        run: |
          base=$(awk '$1 == "FROM" { print $2; exit }' Dockerfile)
          digest=$(docker buildx imagetools inspect "$base" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "image=docker.io/library/$base"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          echo "Base image: $base@$digest"

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: openldap:test
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
            BASE_DIGEST=${{ steps.base.outputs.digest }}
          no-cache: ${{ inputs.no_cache == true }}
          cache-from: type=gha

      - name: Run tests
        run: ./tests/integration/test-integration.sh openldap:test

      - name: Determine version
        id: version
        run: |
          # Extract the OpenLDAP version from the built slapd binary.
          LDAP_VERSION=$(docker run --rm --entrypoint "" openldap:test \
            sh -c 'slapd -VV 2>&1' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "slapd version: $LDAP_VERSION"

          # Get existing tags from registry
          EXISTING_TAGS=$(gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}/versions" \
            --paginate --jq '.[].metadata.container.tags[]' 2>/dev/null || echo "")

          # Find next available build suffix
          SUFFIX=1
          while echo "$EXISTING_TAGS" | grep -qx "${LDAP_VERSION}-${SUFFIX}"; do
            SUFFIX=$((SUFFIX + 1))
          done

          IMAGE_TAG="${LDAP_VERSION}-${SUFFIX}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "ldap_version=$LDAP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Selected version: $IMAGE_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.ldap_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
            BASE_DIGEST=${{ steps.base.outputs.digest }}
          no-cache: ${{ inputs.no_cache == true }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create git tag
        run: |
          git tag "v${{ steps.version.outputs.image_tag }}"
          git push origin "v${{ steps.version.outputs.image_tag }}"

      - name: Generate release notes
        env:
          REASON: ${{ inputs.reason }}
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since ${PREV_TAG}" > release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" >> release_notes.md
          else
            echo "## Initial Release" > release_notes.md
          fi
          if [ -n "$REASON" ]; then
            printf '\n\n## Rebuild\n\n%s\n' "$REASON" >> release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.image_tag }}
          body_path: release_notes.md
          generate_release_notes: false
