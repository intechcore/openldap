name: Rebuild

# Checks the published image and releases a new build (2.6.13-4 -> 2.6.13-5,
# the first build of a new OpenLDAP gets -1) when one of these is true:
#   - the Dockerfile pins a newer OpenLDAP than the published image (Renovate
#     moved the Symas packages to a new version)
#   - the base image digest pinned in FROM differs from the one the image was
#     built on (Renovate updated the digest after Debian rebuilt the tag)
#   - Trivy finds fixable CRITICAL or HIGH vulnerabilities in the published
#     image. Debian ships security fixes as package updates, which change no
#     file in git.
#   - a file that goes into the image changed since the commit the image was
#     built from (org.opencontainers.image.revision)
# It runs once a week, and on every push to main that changes an input, so a
# merged Renovate update releases by itself.

on:
  schedule:
    - cron: '15 5 * * 1'
  push:
    branches: [main]
    # The inputs of the image, and the check itself. Keep this list in sync
    # with INPUTS in the Decide step.
    paths:
      - Dockerfile
      - entrypoint.sh
      - reload-tls.sh
      - 'schema/**'
      - .github/workflows/rebuild.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# No default token permissions. Each job asks for what it needs.
permissions: {}

# One check and release at a time. A run that waits starts after the previous
# release, so it compares with that image: a burst of pushes never publishes
# two builds for the same change.
concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      rebuild: ${{ steps.decide.outputs.rebuild }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      # The full history, to compare the inputs with the commit of the image.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        id: published
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:latest"
          docker pull -q --platform linux/amd64 "$image"
          digest=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.base.digest"}}' "$image")
          version=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image")
          revision=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
          {
            echo "image=$image"
            echo "base_digest=$digest"
            echo "version=$version"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve upstream base image digest
        id: upstream
        run: |
          base=$(awk '$1 == "FROM" { print $2; exit }' Dockerfile)
          digest=$(docker buildx imagetools inspect "$base" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "image=$base"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.published.outputs.image }}
          format: json
          output: trivy-results.json
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Decide
        id: decide
        env:
          BASE: ${{ steps.upstream.outputs.image }}
          BUILT_ON: ${{ steps.published.outputs.base_digest }}
          UPSTREAM: ${{ steps.upstream.outputs.digest }}
          PUBLISHED: ${{ steps.published.outputs.version }}
          REVISION: ${{ steps.published.outputs.revision }}
          # The files that go into the image. Keep the list in sync with the
          # push paths above.
          INPUTS: Dockerfile entrypoint.sh reload-tls.sh schema
        run: |
          # A rebuild never publishes an older OpenLDAP than the latest image.
          # main can pin a lower version when Symas withdraws packages.
          pinned=$(awk -F= '/^ARG OPENLDAP_VERSION=/ { print $2; exit }' Dockerfile)
          if [ -n "$PUBLISHED" ] && [ "$pinned" != "$PUBLISHED" ] &&
            [ "$(printf '%s\n%s\n' "$pinned" "$PUBLISHED" | sort -V | head -n 1)" = "$pinned" ]; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "No rebuild: main pins OpenLDAP ${pinned}, lower than the published ${PUBLISHED}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # One entry per fixable finding, "CVE in package version (fixed in
          # version)", for the release notes. At most ten are named.
          findings=$(jq -r '[.Results[]?.Vulnerabilities[]?
            | "\(.VulnerabilityID) in \(.PkgName) \(.InstalledVersion) (fixed in \(.FixedVersion))"] | unique
            | (.[:10] | join(", ")) + (if length > 10 then ", and \(length - 10) more" else "" end)' trivy-results.json)
          fixable=$(jq '[.Results[]?.Vulnerabilities[]? | .VulnerabilityID + .PkgName] | unique | length' trivy-results.json)
          reasons=()
          if [ -n "$PUBLISHED" ] && [ "$pinned" != "$PUBLISHED" ]; then
            reasons+=("New OpenLDAP version ${pinned}, the published image holds ${PUBLISHED}.")
          fi
          if [ "$BUILT_ON" != "$UPSTREAM" ]; then
            reasons+=("Base image ${BASE%@*} rebuilt upstream (digest ${BUILT_ON:-unknown} -> ${UPSTREAM}).")
          fi
          if [ "$fixable" -gt 0 ]; then
            reasons+=("Fixes ${fixable} CRITICAL/HIGH vulnerabilities found by Trivy: ${findings}.")
          fi
          # INPUTS is a list of paths, split on purpose.
          # shellcheck disable=SC2086
          if [ -z "$REVISION" ] || ! git cat-file -e "${REVISION}^{commit}" 2>/dev/null; then
            echo "::warning::The image names no known commit (${REVISION:-none}), its inputs are not compared."
          else
            changed=$(git diff --name-only "$REVISION" HEAD -- $INPUTS)
            if [ -n "$changed" ]; then
              reasons+=("Image inputs changed since ${REVISION:0:7}: $(echo "$changed" | paste -sd, - | sed 's/,/, /g').")
            fi
          fi

          if [ ${#reasons[@]} -eq 0 ]; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "No rebuild needed: OpenLDAP version, base image and image inputs unchanged, no fixable findings." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          reason=$(printf '%s ' "${reasons[@]}")
          {
            echo "rebuild=true"
            echo "reason=${reason% }"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Rebuild needed"
            printf -- '- %s\n' "${reasons[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: check
    if: needs.check.outputs.rebuild == 'true'
    # A called workflow gets at most these permissions. The release signs the
    # image and the SBOMs, so it needs id-token and attestations too.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      reason: ${{ needs.check.outputs.reason }}
      no_cache: true
