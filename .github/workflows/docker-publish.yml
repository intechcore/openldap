name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: openldap:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: ./tests/integration/test-integration.sh openldap:test

      - name: Run 2.4 to 2.6 migration test
        run: ./tests/integration/test-migration.sh openldap:test
