name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: openldap:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: ./tests/integration/test-integration.sh openldap:test

      - name: Run 2.4 to 2.6 migration test
        run: ./tests/integration/test-migration.sh openldap:test

      - name: Run arm64 runtime smoke test (emulated)
        run: ./tests/integration/test-arch.sh linux/arm64 openldap:arm64test
