name: CI

# Lint, tests on amd64 and arm64, coverage with the SonarCloud analysis, and
# the Trivy scan of the image. Every pull request runs it, and main after a
# merge.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .
          severity: warning
          # renovate: datasource=github-releases depName=koalaman/shellcheck
          version: v0.11.0

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      # Checks the workflows themselves: expressions, inputs, shell in run.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      # Security audit of the workflows, for example template injection or
      # credentials left in the checkout. Informational findings do not fail.
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          min-severity: low
          version: 1.30.1

      # Every variable of the README Configuration table appears in a test.
      - name: Configuration contract
        run: tests/contract.sh

      # Misconfigurations in the Dockerfile, before any image is built.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: '1'
          severity: HIGH,CRITICAL

  # Both architectures are built and tested, each on a native runner.
  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: openldap:test
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Run the integration tests
        run: ./tests/integration/test-integration.sh openldap:test

      - name: Run the 2.4 to 2.6 migration test
        if: matrix.arch == 'amd64'
        run: ./tests/integration/test-migration.sh openldap:test

  # Line coverage of entrypoint.sh and reload-tls.sh, and the SonarCloud
  # analysis. The integration and migration tests run against the coverage
  # stage of the Dockerfile, which traces both scripts with kcov.
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for the token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Pull requests from forks get no secrets. Skip the analysis there.
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No SONAR_TOKEN, SonarCloud analysis skipped"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.token.outputs.present == 'true'

      - name: Build the coverage image
        if: steps.token.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: coverage
          load: true
          tags: openldap:coverage
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=coverage

      - name: Run the tests with coverage
        if: steps.token.outputs.present == 'true'
        run: tests/coverage.sh openldap:coverage build

      - name: SonarCloud scan
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Fixable vulnerabilities in the built image. CRITICAL fails the build. HIGH
  # goes to a tracking issue only: an unrelated pull request must not turn red
  # because Debian released a fix. The weekly rebuild picks the fix up.
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: openldap:scan

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openldap:scan
          format: json
          output: trivy-results.json
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Summary, tracking issue on push, and failure on CRITICAL. The same
      # action lives in each intechcore image repository.
      - name: Report the findings
        uses: ./.github/actions/trivy-report
        with:
          report: ${{ github.event_name == 'push' }}
          token: ${{ github.token }}
