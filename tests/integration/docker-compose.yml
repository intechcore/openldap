services:
  openldap:
    image: ${IMAGE_NAME:-openldap}:${IMAGE_TAG:-2.6.13}
    container_name: openldap-integration-test
    environment:
      LDAP_ORGANISATION: "Example Test Org"
      LDAP_DOMAIN: "example.test"
      LDAP_ADMIN_PASSWORD: "adminpw"
      LDAP_CONFIG_PASSWORD: "configpw"
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "readonly"
      LDAP_READONLY_USER_PASSWORD: "ropw"
      LDAP_READONLY_PW_USER: "true"
      LDAP_READONLY_PW_USERNAME: "readpw"
      LDAP_READONLY_PW_PASSWORD: "readpwpw"
      LDAP_LASTBIND: "true"
      LDAP_UNIQUE: "true"
      LDAP_TLS: "true"
      LDAP_TLS_VERIFY_CLIENT: "never"
      LDAP_LOG_LEVEL: "256"
    volumes:
      # Mount the custom test schema as a single file so the image's baked
      # /schema (e.g. openssh-lpk.schema) is not shadowed by the bind mount.
      - ./fixtures/schema/99-test.ldif:/schema/99-test.ldif:ro
      - ./fixtures/overlays:/overlays:ro
      - ./fixtures/bootstrap:/bootstrap:ro
    ports:
      - "${LDAP_TEST_PORT:-3389}:389"
      - "${LDAPS_TEST_PORT:-6636}:636"
