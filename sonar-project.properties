sonar.projectKey=intechcore_openldap
sonar.organization=intechcore
sonar.projectName=openldap

sonar.sources=.
sonar.exclusions=tests/**,build/**
sonar.tests=tests
sonar.test.exclusions=tests/integration/fixtures/**

# Written by tests/coverage.sh in the sonar job of .github/workflows/ci.yml.
sonar.coverageReportPaths=build/coverage.xml
# The Let's Encrypt example is documentation, it is not part of the image.
sonar.coverage.exclusions=examples/**
